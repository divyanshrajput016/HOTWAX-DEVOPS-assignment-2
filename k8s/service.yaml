apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
spec:
  type: NodePort

  selector:
    app: backend
    
  ports:
    - Port: 3000
      targetPort: 3000
      NodePort: 30001

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - Port: 3000
      targetPort: 3000
      NodePort: 30000
  
---
apiVersion: v1
kind: Service
metadata:
  name: database-service
  labels:
    app: database
spec:
  type: NodePort
  selector:
    app: database
  ports:
    - Port: 27017
      targetPort: 27017